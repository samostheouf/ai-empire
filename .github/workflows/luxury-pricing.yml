name: HERMES Luxury — Pricing 09h
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  luxury-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call luxury-pricing
        run: |
          set -e
          CODE=$(curl -s -o /tmp/pricing.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-empire-steel.vercel.app/api/cron/luxury-pricing")
          cat /tmp/pricing.json | head -c 3000; echo
          echo "HTTP $CODE"
          test "$CODE" = "200"
