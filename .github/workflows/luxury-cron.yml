name: HERMES Luxury — Hub 5m + Crosslist-Sync 5m + Pricing 09h
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  luxury-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call luxury-hub
        run: |
          set -e
          CODE=$(curl -s -o /tmp/hub.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-empire-steel.vercel.app/api/cron/luxury-hub")
          cat /tmp/hub.json | head -c 3000; echo
          echo "HTTP $CODE"
          test "$CODE" = "200"
  crosslist-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call crosslist-sync 5m
        run: |
          set -e
          CODE=$(curl -s -o /tmp/cross.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-empire-steel.vercel.app/api/cron/crosslist-sync")
          cat /tmp/cross.json | head -c 3000; echo
          echo "CROSSLIST HTTP $CODE"
          test "$CODE" = "200"
          if grep -q "CROSSLIST_ALERT" /tmp/cross.json; then
            echo "::warning::VENTE DETECTEE — desactiver autres plateformes <15min"
          fi
  luxury-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call luxury-pricing (only at 09 UTC)
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" != "09" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skip pricing — not 09 UTC"
            exit 0
          fi
          CODE=$(curl -s -o /tmp/pricing.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-empire-steel.vercel.app/api/cron/luxury-pricing")
          cat /tmp/pricing.json | head -c 3000; echo
          echo "PRICING HTTP $CODE"
          test "$CODE" = "200"
